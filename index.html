<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0284c7" />
    <title>אלגברה בלי טעויות</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <!-- Start: level, then topics -->
      <section id="start" class="screen">
        <header class="hero">
          <div class="hero-symbols" aria-hidden="true">
            <span>π</span><span>√</span><span>∑</span><span>x²</span><span>∞</span><span>÷</span><span>≠</span><span>±</span><span>f(x)</span><span>∫</span>
          </div>
          <div class="logo" aria-hidden="true"><i>x</i><sup>2</sup></div>
          <h1>אלגברה בלי טעויות</h1>
          <p>שאלות אמריקאיות על חוקי האלגברה ועל הטעויות הנפוצות בהם. בלי חישובים ארוכים.</p>
        </header>

        <h2><span class="step-badge">1</span>בוחרים רמה</h2>
        <div id="level-choices" class="levels" role="group" aria-label="רמה"></div>

        <h2><span class="step-badge">2</span>בוחרים נושאים <span class="h2-hint">אפשר לבחור כמה</span></h2>
        <div id="topic-choices" class="chips" role="group" aria-label="נושא"></div>
        <p id="pool-count" class="muted"></p>

        <button id="start-button" type="button" class="primary">
          התחילו סבב של 10 שאלות <span class="arrow" aria-hidden="true">←</span>
        </button>
      </section>

      <!-- Play: one question at a time -->
      <section id="play" class="screen" hidden>
        <div class="topbar">
          <button id="quit-button" type="button" class="icon-button" aria-label="חזרה לתפריט">✕</button>
          <span id="progress-text"></span>
          <span id="score-text" class="score-pill"></span>
        </div>
        <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>

        <article class="card question-card">
          <div class="tags">
            <span id="type-tag" class="tag tag-type"></span>
            <span id="topic-tag" class="tag"></span>
          </div>
          <p id="prompt" class="prompt"></p>
          <ol id="steps" class="steps" hidden></ol>
        </article>

        <div id="options" class="options"></div>

        <div id="feedback" class="feedback" role="status" aria-live="polite" hidden>
          <p id="feedback-title" class="feedback-title"></p>
          <p id="explanation" class="explanation"></p>
          <button id="next-button" type="button" class="primary">לשאלה הבאה</button>
        </div>
      </section>

      <!-- Results -->
      <section id="results" class="screen" hidden>
        <h1 class="results-title">סיכום הסבב</h1>
        <div id="score-ring" class="score-ring" role="img">
          <div class="score-ring-inner">
            <span id="final-score" class="final-score" dir="ltr"></span>
            <span class="final-label">תשובות נכונות</span>
          </div>
        </div>
        <p id="final-message" class="final-message"></p>
        <div id="weak-section" class="card">
          <h2>נושאים לחזור עליהם</h2>
          <ul id="weak-topics" class="weak-topics"></ul>
        </div>
        <button id="retry-wrong-button" type="button" class="primary">לתרגל שוב את השאלות שטעיתי בהן</button>
        <button id="again-button" type="button" class="secondary">סבב חדש</button>
        <button id="menu-button" type="button" class="link-button">חזרה לבחירת רמה ונושא</button>
      </section>
    </main>

    <script src="vendor/katex/katex.min.js"></script>
    <script src="src/bank.js"></script>
    <script src="src/quiz.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
